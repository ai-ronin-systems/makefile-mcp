[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "make-mcp"
version = "0.1.0"
description = "Expose explicitly allowed Make targets as safe CLI and MCP operations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Make MCP contributors"}]
dependencies = [
  "mcp==2.0.0",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
make-mcp = "make_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/make_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
